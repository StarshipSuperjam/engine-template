# engine-coordination-postmerge — the DETERMINISTIC merge-reaction fan-out for advisory session coordination
# (StarshipSuperjam/engine-template#939, eADR-0043). When ANY pull request merges, three advisory signals are reactions to that
# merge: open candidates' greens may be stale (revalidation), a merge may have touched a peer's declared
# surface (dependency-update), and the integration slot just freed (next-in-queue). The base advances the
# instant the merge lands, so these ride the merge EVENT here — never a human remembering to run a verb. The
# driver (tools/coordination_postmerge.py) reads GitHub live and posts advisory notices onto the affected
# candidates' coordination boards; it merges/labels/changes nothing (confined to comment writes by
# coordination_board.comment_only, eADR-0043 law 3).
#
# PRESENT-BUT-INERT WITHOUT CONCURRENCY. Ships committed in every repo; with no other open candidate the fan-out
# posts nothing. It is advisory-only: a failure NEVER reddens the run (the merge already happened), so the step
# always exits 0 and surfaces its outcome in the run summary.
#
# SAFETY OF THE BROAD TRIGGER. Fires on ANY merged pull request. The driver is the backstop: it re-confirms the
# pull request actually merged, it can reach GitHub only through comment + read endpoints, and every emit is
# best-effort and deduplicated (a re-run for the same merge posts nothing new). A fork pull request's merged
# run gets a read-only token, so its comment posts simply no-op — advisory latency lost, never correctness.
name: Coordinate after a merge

# Not pull_request_target: the merged code is already on trusted main; this acts on the reviewed merge commit,
# never fork head code. (A fork pull request also gets a read-only token, so it could never post here anyway.)
on:
  pull_request:
    types: [closed]

# Least privilege. `contents: read` is for the checkout step (materializing the engine tool-runtime on the
# merged commit) — the same grant every sibling workflow that checks out uses. `pull-requests: write` is the
# ONLY write scope: the driver posts/edits issue comments (the coordination board) and nothing else — no
# merge, no labels, no statuses, no contents write. The advisory-only law made a token scope.
permissions:
  contents: read
  pull-requests: write

# One fan-out at a time per merged pull request; a re-run queues rather than cancelling a run mid-post.
concurrency:
  group: coordination-postmerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  coordinate:
    name: coordinate
    runs-on: ubuntu-latest
    # Only a MERGED pull request reacts. A pull request closed without merging is ignored.
    if: github.event.pull_request.merged == true
    steps:
      # Check out the EXACT merged commit (not main's tip, which may have moved) so the engine tooling this run
      # invokes — tier resolution reads the committed manifest — matches the reviewed unit.
      - name: Check out the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"
      - name: Materialize the engine tool-runtime
        run: uv sync --directory .engine --frozen
      # Fan out advisory notices. The merged PR number and merge SHA reach the tool ONLY as quoted environment
      # variables, never interpolated into the script body, so no event value can inject a shell command. The
      # step always exits 0 — coordination is advisory and must never redden a merged-PR run.
      - name: Post advisory coordination notices
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          sum="${RUNNER_TEMP}/coordination-summary.md"
          uv run --directory .engine --frozen -- python tools/coordination_postmerge.py \
            --summary-out "${sum}" || true
          if [ -s "${sum}" ]; then cat "${sum}" >> "${GITHUB_STEP_SUMMARY}"; fi
