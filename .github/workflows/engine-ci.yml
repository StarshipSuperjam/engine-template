# engine-ci — the seed's required validator check (required check #1).
# Materializes the engine tool-runtime, then either runs the full merge gate — the validator over the CI suite
# plus the checker-of-checkers self-tests — or, for an event that cannot have changed the code under test,
# verifies the receipt an earlier full run left for the IDENTICAL checked-out tree and re-runs only the checks
# whose verdict can change while that tree is unchanged.
#
# THE CHECK NOW HAS TWO ROUTES TO GREEN, and this is what the guardrail acknowledgement on this change is
# about. Route one is unchanged: the inventory ran in this run. Route two is a verified receipt from an earlier
# successful run of this same workflow, bound to the git TREE hash of the checkout — content-addressed, so it
# is identical only if the content is. New or changed code never takes route two: every push, open and reopen
# runs the full inventory, as does every run on the default branch. Only a body edit or a label change can
# reuse, and only for a tree already judged. Any doubt — no receipt, an unreadable one, an API failure —
# resolves to the full run. A reuse run uploads no receipt, so reuse can never chain off reuse.
#
# The job name `engine-ci` is the FROZEN check context bound in the branch
# ruleset; renaming it is a guardrail-weakening change.
name: engine-ci

on:
  # The default-branch run gives the README health badge a stable main witness, and is the signal the engine's
  # own telemetry and integration queue read. It is never a reuse run: a branch push has no pull request, so
  # the gate resolves it to the full inventory.
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` so applying an acknowledgment label (e.g. `guardrail-ack`, the product-design
    # lock-integrity re-acceptance) re-runs the metadata checks and clears its check without needing a fresh
    # push — precisely the case that used to re-spend the whole inventory on an unchanged tree.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# No concurrency group, deliberately. Cancelling a run of the required check would introduce a `cancelled`
# conclusion, which the engine's telemetry treats as not-passing and promotes to a tracked finding, which the
# integration queue refuses, and which nothing re-runs. A metadata event arriving while a full run is still in
# flight simply finds no receipt yet and runs the inventory itself — the same thing it does today, so no
# regression, and it is self-correcting once the first run completes.

permissions:
  contents: read
  pull-requests: read
  statuses: read        # lock-integrity reads the head-bound engine-ack acknowledgment status (StarshipSuperjam/engine-template#710)
  actions: read         # the gate lists this workflow's own runs and reads one receipt artifact; read-only

jobs:
  engine-ci:
    name: engine-ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"
      - name: Materialize the engine tool-runtime
        run: uv sync --directory .engine --frozen
      - name: Decide whether this run owes the full inventory
        # UNCONDITIONED on purpose. It publishes its verdict to the job environment, which the two arms below
        # condition on. It reads the event from $GITHUB_EVENT_PATH, never from an interpolated argument, and
        # every failure inside it resolves toward the full inventory rather than toward reuse.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py decide
      - name: Run the seed validator (CI suite)
        # The two arms are MUTUAL NEGATIONS of one value, so no third state can skip both. The platform treats
        # a skipped step as successful, so a pair of positive equalities would let an unexpected value produce
        # a green job with nothing run. The negation also defaults toward MORE work: anything that is not
        # exactly `reuse` earns the full inventory.
        if: env.ENGINE_CI_MODE != 'reuse'
        # The validator reads the PR body from $GITHUB_EVENT_PATH (.pull_request.body),
        # never from an interpolated shell argument.
        # It also reads the current body live from the API during CI, falling back to that
        # event payload when the live read is unavailable (StarshipSuperjam/engine-template#949).
        # The `pull-requests: read` permission above lets the live read succeed in a private repo.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The repo's AUTHORITATIVE current default branch (on a pull_request the repository payload is
          # populated), so the protected-branch check verifies the branch GitHub actually protects — not a
          # hard-coded "main" that would check the wrong branch on a repo whose default is e.g. "master".
          PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --directory .engine --frozen -- python tools/validate.py --suite CI
      - name: Run the self-tests (the checker-of-checkers)
        if: env.ENGINE_CI_MODE != 'reuse'
        # -b (buffer): unittest captures each test's stdout/stderr and discards it on
        # success, replaying only a FAILING test's output. Keeps a green run's tail (the
        # `Ran N tests … OK` summary) from being buried under demo-test walkthrough output.
        run: uv run --directory .engine --frozen -- python -m unittest discover -s tools -p 'test_*.py' -b
      - name: Write the full-suite receipt
        # Only after BOTH the validator and the inventory have passed, so the receipt is an attestation by
        # construction rather than by assertion — a failure above fails the job and skips this.
        if: env.ENGINE_CI_MODE != 'reuse' && github.event_name == 'pull_request'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py emit-receipt --out "$RUNNER_TEMP/receipt.json"
      - name: Upload the full-suite receipt
        # The ONLY upload in this workflow, and it is conditioned on the full arm. That is what makes artifact
        # presence the structural marker separating a genuine full run from a reuse run of the same workflow —
        # run metadata reports the event but not the action, so it cannot make that distinction itself.
        if: env.ENGINE_CI_MODE != 'reuse' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-ci-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 30
          if-no-files-found: error
      - name: Record that the full arm completed
        if: env.ENGINE_CI_MODE != 'reuse'
        run: echo "ENGINE_CI_RAN=full" >> "$GITHUB_ENV"
      - name: Re-check what an unchanged tree cannot settle
        # The reuse arm. It runs the checks whose verdict can change while the tree is unchanged — the
        # pull-request body rules, the product lock, and branch protection — as a BLOCKING gate, so a body
        # edited to strip a required section still turns this check red.
        if: env.ENGINE_CI_MODE == 'reuse'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --directory .engine --frozen -- python tools/validate.py --suite CI-metadata
      - name: Record that the reuse arm completed
        if: env.ENGINE_CI_MODE == 'reuse'
        run: echo "ENGINE_CI_RAN=reuse" >> "$GITHUB_ENV"
      - name: Refuse a run in which no arm did any work
        # UNCONDITIONED, and the last word. The arms above write their marker on finishing; this fails unless
        # one of them did. Without it, a value the arms did not anticipate would skip both, every step would
        # report as successful, and the frozen required context would go green having proven nothing.
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py assert-ran
