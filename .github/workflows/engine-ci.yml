# engine-ci — the seed's required validator check (required check #1).
# Materializes the engine tool-runtime, then runs one of three arms: the full merge gate — the validator over
# the CI suite plus the checker-of-checkers self-tests; or, for an event that cannot have changed the code under
# test, verifies the receipt an earlier full run left for the IDENTICAL checked-out tree and re-runs only the
# checks whose verdict can change while that tree is unchanged; or, in a DEPLOYED copy whose change set lies
# outside everything the Engine owns, the validator CI suite alone.
#
# THE CHECK HAS THREE ROUTES TO GREEN, and each route's introduction carried a guardrail acknowledgement. Route
# one: the inventory ran in this run. Route two: a verified receipt from an earlier successful run of this same
# workflow, bound to the git TREE hash of the checkout — content-addressed, so it is identical only if the
# content is. New or changed ENGINE code never takes route two: every push, open and reopen of a change that
# touches the Engine runs the full inventory, as does every run on the default branch. Only a body edit or a
# label change can reuse, and only for a tree already judged. A reuse run still re-runs the checks whose verdict
# CAN change while the tree is unchanged — the pull-request body rules, the product-design lock, branch
# protection, and the dependency-advisory screen (which reads GitHub's live advisory database, so an identical
# dependency can turn red as a new advisory is published) — and skips the rest of the CI validator rules and the
# whole self-test inventory, which a tree already judged cannot change. A receipt is honoured for at most 14
# days — deliberately tighter than the artifact's 30-day physical retention — past which even a metadata event
# runs full. Any doubt — no receipt, an unreadable one, an API failure — resolves to the full run. A reuse run
# uploads no receipt, so reuse can never chain off reuse.
#
# ROUTE THREE, PROJECT-ONLY (StarshipSuperjam/engine-template#758 and StarshipSuperjam/engine-template#883)
# is the larger weakening and the one the acknowledgement on ITS change was about: in a deployed copy of the
# Engine, when the change classifier
# (.engine/tools/change_classification.py) places every changed path of the merge checkout outside every Engine
# corner, every declared root file and the live ownership register — resolving every doubt, and the home
# repository itself, to "the Engine's" — the run executes the full validator CI suite and NOT the self-test
# inventory. New product code takes this route on every push of a product-only pull request. The run uploads a
# receipt stamped project-only, which route two refuses by mode (reuse never chains off it) and which the Build
# Coordinator's final import accepts only after re-deriving the same verdict itself. The run's summary states
# what did not run and that its green attests Engine health only — no product validation ran, and none is
# registered until StarshipSuperjam/engine-template#1147. A run that cannot write that disclosure refuses the
# route. The repository variable ENGINE_CI_PROJECT_ONLY_ARM=off switches the route off for a deployment.
#
# The job name `engine-ci` is the FROZEN check context bound in the branch
# ruleset; renaming it is a guardrail-weakening change.
name: engine-ci

on:
  # The default-branch run gives the README health badge a stable main witness, and is the signal the engine's
  # own telemetry and integration queue read. It is never a reuse run: a branch push has no pull request, so
  # the gate resolves it to the full inventory.
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` so applying an acknowledgment label (e.g. `guardrail-ack`, the product-design
    # lock-integrity re-acceptance) re-runs the metadata checks and clears its check without needing a fresh
    # push — precisely the case that used to re-spend the whole inventory on an unchanged tree.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# No concurrency group, deliberately. Cancelling a run of the required check would introduce a `cancelled`
# conclusion, which the engine's telemetry treats as not-passing and promotes to a tracked finding, which the
# integration queue refuses, and which nothing re-runs. A metadata event arriving while a full run is still in
# flight simply finds no receipt yet and runs the inventory itself — the same thing it does today, so no
# regression, and it is self-correcting once the first run completes.

permissions:
  contents: read
  pull-requests: read
  statuses: read        # lock-integrity reads the head-bound engine-ack acknowledgment status (StarshipSuperjam/engine-template#710)
  actions: read         # the gate lists this workflow's own runs and reads one receipt artifact; read-only

jobs:
  engine-ci:
    name: engine-ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out the revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Two, not the default one: a pull-request run checks out the MERGE commit, and the change classifier
          # diffs it against its first parent (the base tip) to bound the change set to this pull request. The
          # classifier verifies the two-parent shape itself; a checkout without it resolves to the full run.
          fetch-depth: 2
      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"
      - name: Materialize the engine tool-runtime
        run: uv sync --directory .engine --frozen
      - name: Decide whether this run owes the full inventory
        # UNCONDITIONED on purpose. It publishes its verdict as this step's OWN OUTPUT, which the two arms
        # below condition on. The output is the point: a step's outputs can be written only by that step, so
        # nothing the job runs afterwards — the self-test inventory very much included — can reach
        # `steps.gate.outputs.mode` and change which arm runs. The job ENVIRONMENT cannot carry this: it is
        # mutable across steps, and a later step that appends to $GITHUB_ENV rewrites what every subsequent
        # step's condition reads. That is not hypothetical — it is the defect this workflow is repairing
        # (StarshipSuperjam/engine-template#1043).
        # It reads the event from $GITHUB_EVENT_PATH, never from an interpolated argument, and every failure
        # inside it resolves toward the full inventory rather than toward reuse.
        id: gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The per-deployment off switch for route three. A repository variable, so a deployed operator can
          # turn the project-only arm off without an engine release; only the exact value `off` disables.
          ENGINE_CI_PROJECT_ONLY_ARM: ${{ vars.ENGINE_CI_PROJECT_ONLY_ARM }}
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py decide
      - name: Run the seed validator (CI suite)
        # The full arm is the NEGATION of both other modes, so no third state can skip every arm. The platform
        # treats a skipped step as successful, so positive equalities alone would let an unexpected value
        # produce a green job with nothing run. The negation also defaults toward MORE work: anything that is
        # not exactly `reuse` or `project-only` earns the full inventory — including the empty string a
        # mistyped step reference would yield, so a broken reference costs work rather than skipping it.
        if: steps.gate.outputs.mode != 'reuse' && steps.gate.outputs.mode != 'project-only'
        # The validator reads the PR body from $GITHUB_EVENT_PATH (.pull_request.body),
        # never from an interpolated shell argument.
        # It also reads the current body live from the API during CI, falling back to that
        # event payload when the live read is unavailable (StarshipSuperjam/engine-template#949).
        # The `pull-requests: read` permission above lets the live read succeed in a private repo.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The repo's AUTHORITATIVE current default branch (on a pull_request the repository payload is
          # populated), so the protected-branch check verifies the branch GitHub actually protects — not a
          # hard-coded "main" that would check the wrong branch on a repo whose default is e.g. "master".
          PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --directory .engine --frozen -- python tools/validate.py --suite CI
      - name: Run the self-tests (the checker-of-checkers)
        # This step's OUTCOME is the full arm's completion evidence, read by the terminal step below. It is
        # the right step to read: it is the arm's substantive work and, unlike the receipt steps, carries no
        # event condition, so it reports honestly on a `push` to the default branch too.
        id: selftests
        if: steps.gate.outputs.mode != 'reuse' && steps.gate.outputs.mode != 'project-only'
        # -b (buffer): unittest captures each test's stdout/stderr and discards it on
        # success, replaying only a FAILING test's output. Keeps a green run's tail (the
        # `Ran N tests … OK` summary) from being buried under demo-test walkthrough output.
        env:
          # DECOY CONTROL FILES. This is the one step in the job that runs arbitrary code — the whole
          # test inventory — so it is the one place the job's control plane needs protecting. The runner
          # reads back the control file at the path IT generated; handing this step's child processes a
          # different path means a test that writes one of these scribbles into a throwaway under
          # RUNNER_TEMP and the real file is never touched. One edit at the actual trust boundary, covering
          # every test module written from now on, rather than a convention each future author must recall.
          GITHUB_ENV: ${{ runner.temp }}/decoy-github-env
          GITHUB_OUTPUT: ${{ runner.temp }}/decoy-github-output
          GITHUB_PATH: ${{ runner.temp }}/decoy-github-path
          GITHUB_STATE: ${{ runner.temp }}/decoy-github-state
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/decoy-github-step-summary
        run: uv run --directory .engine --frozen -- python -m unittest discover -s tools -p 'test_*.py' -b
      - name: Run the seed validator alone (project-only change set)
        # The project-only arm: the FULL validator CI suite, and nothing else. It is a separate step rather
        # than a second condition on the validator step above because the terminal assertion reads each arm's
        # own step outcome, and the env block is kept IDENTICAL to that step's (a test holds them equal).
        # This step's OUTCOME is the project-only arm's completion evidence. It sits ABOVE the receipt steps
        # so that a failure here fails the job before a receipt is written — the receipt attests by
        # construction only when every substantive step of its arm precedes it (a test holds the order).
        id: project
        if: steps.gate.outputs.mode == 'project-only'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --directory .engine --frozen -- python tools/validate.py --suite CI
      - name: Write the receipt
        # Only after the arm's substantive steps have passed, so the receipt is an attestation by construction
        # rather than by assertion — a failure above fails the job and skips this. Runs for the full arm AND
        # the project-only arm (everything that is not reuse); the receipt's MODE is the gate's own verdict,
        # handed in below, so a project-only run can never mint a full attestation. The emitter refuses any
        # mode it cannot vouch for.
        if: steps.gate.outputs.mode != 'reuse' && github.event_name == 'pull_request'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ENGINE_CI_MODE: ${{ steps.gate.outputs.mode }}
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py emit-receipt --out "$RUNNER_TEMP/receipt.json"
      - name: Upload the receipt
        # The ONLY upload in this workflow, and a reuse run never reaches it. Artifact presence separates a
        # run that left a receipt from a reuse run of the same workflow — run metadata reports the event but
        # not the action, so it cannot make that distinction itself — and the receipt's mode separates a full
        # run from a project-only one; the reuse route accepts only the former.
        if: steps.gate.outputs.mode != 'reuse' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-ci-receipt
          path: ${{ runner.temp }}/receipt.json
          retention-days: 30
          if-no-files-found: error
          # A re-run of a full run (`gh run rerun`) re-executes this step; artifacts are namespaced per run, not
          # per attempt, so without this the re-run would pay the whole inventory again and then FAIL on a
          # duplicate artifact name. The name must stay fixed (the discovery filter matches it exactly), so
          # overwrite — not a per-attempt name, which would silently break reuse.
          overwrite: true
      - name: Re-check what an unchanged tree cannot settle
        # The reuse arm. It runs the checks whose verdict can change while the tree is unchanged — the
        # pull-request body rules, the product lock, branch protection, and the dependency-advisory screen —
        # as a BLOCKING gate, so a body edited to strip a required section, or a newly-published advisory against
        # an unchanged dependency, still turns this check red.
        # This step's OUTCOME is the reuse arm's completion evidence, as the self-test step's is the full
        # arm's.
        id: metadata
        if: steps.gate.outputs.mode == 'reuse'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROTECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: uv run --directory .engine --frozen -- python tools/validate.py --suite CI-metadata
      - name: Refuse a run in which no arm did any work
        # Carries NO CONDITION OF ITS OWN, and is the last word. Without it, a value the arms did not
        # anticipate would skip both, every step would report as successful, and the frozen required context
        # would go green having proven nothing.
        #
        # It is not literally unconditional: a step with no `if:` still carries the platform's implicit
        # success() gate, so it does not run when an earlier step FAILED. That is the behaviour we want — a
        # job already red needs no second refusal — and it is why this guards the SKIP case specifically.
        #
        # The completion evidence is the PLATFORM'S OWN verdict on each arm — `steps.<id>.outcome`, which
        # only the runner writes and only for the step it names. An arm that ran reports `success`; one whose
        # condition was false reports `skipped`. That is strictly better than a marker line an arm echoes
        # about itself: it is bound to the arm step by identity rather than by ordering, and it cannot be
        # forged by anything the job runs. Passing it in as step-level `env:` also shadows any value an
        # earlier step pushed into the job environment under the same name.
        env:
          ENGINE_CI_FULL_RAN: ${{ steps.selftests.outcome }}
          ENGINE_CI_REUSE_RAN: ${{ steps.metadata.outcome }}
          ENGINE_CI_PROJECT_ONLY_RAN: ${{ steps.project.outcome }}
        run: uv run --directory .engine --frozen -- python tools/ci_gatekeeper.py assert-ran
