# engine-issue-kind-label — the on:issues reconciler that keeps an engine Issue's kind consistent, in both the
# GitHub-native label and the title's `Kind:` prefix. On every Issue opened or edited it (1) applies the fitting
# native label (bug/enhancement/documentation/question) — apply-only, skipping a native label the repo owner
# deleted (it mints nothing) — and (2) for an engine-authored Issue carrying the authoritative engine-kind
# marker, repairs a missing/invented/stale title prefix to match that marker. It NEVER gates Issue creation
# (GitHub cannot) — an honest backstop, not a wall.
# ADVISORY: not a required check, so a finding can never block a merge.
#
# DEMO-VERIFIED, NOT END-TO-END HERE. GitHub runs `on: issues` only on a live deployed repo, so in this
# construction repo the behaviour is proven by `issue_kind_label.py demo` (real logic, fake GitHub), not
# end-to-end. The first live firing on a deployed repo is its end-to-end confirmation.
#
# LOOP SAFETY. This net now edits titles (a watched `edited` event), so it no longer rests on "only ever adds a
# label". Production loop-prevention rests on GitHub's rule that an event caused by the workflow's own automation
# token does not start another workflow run — so the reconciler's own title edit does not re-fire this net. As
# defense-in-depth the title repair is an idempotent fixed point: a second pass over an already-canonical title
# writes nothing. The per-Issue concurrency group below only serialises runs; it is not the loop container.
name: engine-issue-kind-label

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read   # for the checkout (to materialize the engine tool-runtime)
  issues: write    # to add the derived native kind label (GitHub grants no finer "labels" scope)

# Serialize runs for the SAME Issue so a rapid opened+edited cannot race the read-then-add. Distinct from the
# conformance net's group so the two unrelated on:issues workflows never needlessly serialize against each other.
# cancel-in-progress: false — let an in-flight apply finish, never half-act.
concurrency:
  group: engine-issue-kind-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  kind-label:
    name: engine-issue-kind-label
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.8"
      - name: Materialize the engine tool-runtime
        run: uv sync --directory .engine --frozen
      - name: Apply the native kind label from the issue title
        # The tool reads the issue title/number from $GITHUB_EVENT_PATH (.issue.*), never from an
        # interpolated shell argument — no attacker-controlled title reaches the shell, and the label it
        # applies is a fixed enum, never raw title text.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run --directory .engine --frozen -- python tools/issue_kind_label.py
